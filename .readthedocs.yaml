# Read the Docs configuration file, see
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

# Required since Read the Docs retired the implicit build image: the Python
# version now belongs into build.tools, not into python.version.
build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

formats:
  - epub
  - pdf

python:
  install:
    - requirements: docs/requirements.txt
